schema_version = 1

[actor]
id = "onebot-cxx.message-store"
name = "message_store"
version = "0.1.0"
abi = 2

[artifact]
name = "message_store"
target = "message_store_actor"
kind = "shared-library"
entrypoint = "obcx_create_actor_v2"
platforms = ["linux-x86_64"]

[dependencies]
packages = ["sqlite3"]
actors = []

[compatibility]
obcx = ">=1.1.0,<2.0.0"
actor_abi_min = 2
actor_abi_max = 2

[publication]
repository = "https://github.com/Onebot-CXX/obcx-actor-message-store"
homepage = "https://github.com/Onebot-CXX/obcx-actor-message-store"
license = "MIT"
description = "Persistent received-message actor for OBCX pipelines"
