name: Validate Actor Submission

on:
  pull_request:
    paths:
      - "actors/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run actor registry tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate and generate actor index
        run: python3 scripts/generate_index.py --output /tmp/actor-registry
