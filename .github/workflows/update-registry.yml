name: Update Actor Registry

on:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "schemas/**"
      - "generate_actor_index.py"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test actor registry
        run: python3 -m unittest discover -s tests -v
      - name: Generate actor index
        run: |
          python3 generate_actor_index.py validate
          python3 generate_actor_index.py generate
      - name: Commit generated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(registry): regenerate actor index"
          file_pattern: "index/**"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./index
          force_orphan: true
